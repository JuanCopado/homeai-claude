name: Medir variantes
# Mide 1/2/3 variantes por petición con el modelo real de Hugging Face y el
# puntuador de calidad (server/validation/bench_variants.py). Necesita el
# secreto HF_TOKEN del repositorio y GASTA CRÉDITO de Hugging Face
# (~26 generaciones por ejecución), así que solo corre en su propia rama
# o a mano.
on:
  push:
    branches: [claude/variantes-calidad]
    paths:
      - server/validation/bench_variants.py
      # (A propósito NO se incluye este fichero: editar el workflow no debe
      # relanzar una medición que gasta crédito.)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bench-variants
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r server/requirements.txt requests
      - run: cd server/validation && python bench_variants.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Guardar resultados en la rama
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/validation/results_variants
          git commit -m "Resultados de la medición de variantes" || exit 0
          # Otros workflows pueden haber subido a la rama mientras tanto.
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
