name: Coste real por petición (API)
# 2-3 llamadas reales a Qwen-Image-Edit por la Inference API para medir el
# coste en producción (server/validation/api_cost_probe.py). GASTA CRÉDITO
# (~0,03 $ por llamada): solo se lanza A MANO (Actions → este workflow →
# Run workflow), nunca con un push.
on:
  workflow_dispatch:
    inputs:
      calls:
        description: "Llamadas (1-3)"
        default: "2"
permissions:
  contents: write
concurrency:
  group: api-cost-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r server/requirements.txt requests
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROBE_CALLS: ${{ inputs.calls }}
        run: cd server/validation && python api_cost_probe.py
      - name: Guardar resultados en la rama
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/validation/results_api_cost
          git commit -m "Resultados de la prueba de coste por la API" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
